<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Valentine’s Day 🤍</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: url('https://drive.google.com/file/d/1MgvTSDX1jCvx1PqT_UP5Vc8uoQeg4p7P/view?usp=drivesdk?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  color: white;
  position: relative;
}

/* Dark overlay for better readability */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(3px);
  z-index: 0;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: float 8s linear infinite;
  opacity: 0.6;
  z-index: 1;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  30% { opacity: 0.8; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* Card */
.card {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.15);
  padding: 35px 25px;
  border-radius: 25px;
  text-align: center;
  max-width: 360px;
  max-height: 450px;
  overflow-y: auto;
  backdrop-filter: blur(12px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  animation: fadeIn 1.5s ease;
  scroll-behavior: smooth;
}

/* Custom Scrollbar */
.card::-webkit-scrollbar {
  width: 8px;
}
.card::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}
.card::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ffffff, #ffd1dc);
  border-radius: 10px;
}
.card {
  scrollbar-width: thin;
  scrollbar-color: #ffffff rgba(255,255,255,0.1);
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(40px); }
  to { opacity:1; transform:translateY(0); }
}

h1 {
  font-size: 26px;
}

#typewriter {
  font-size: 16px;
  line-height: 1.7;
  min-height: 100px;
  margin-top: 15px;
}

button {
  margin-top: 20px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #ff4f81;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: white;
  color: #ff4f81;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  transition: 0.4s;
  z-index: 10;
}

.popup.active {
  transform: translate(-50%, -50%) scale(1);
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 5;
}

.overlay.active {
  display: block;
}
</style>
</head>

<body>

<script>
for(let i=0;i<25;i++){
  let heart = document.createElement("div");
  heart.className="heart";
  heart.innerHTML="🤍";
  heart.style.left=Math.random()*100+"%";
  heart.style.animationDuration=(5+Math.random()*5)+"s";
  heart.style.fontSize=(15+Math.random()*20)+"px";
  document.body.appendChild(heart);
}
</script>

<div class="card">
  <h1>Happy Valentine’s Day 🤍</h1>
  <div id="typewriter"></div>
  <button onclick="showLove()">Click For Surprise 💕</button>
</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
  <h2>You Are My Forever 🤍</h2>
  <p>This is just the beginning of our story, and I can’t wait to see how it unfolds. Happy Valentine’s Day to the one who makes my heart race.</p>
  <button onclick="closeLove()">Close</button>
</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
const text = "To my future wife,\n\nBetween every sunrise and every silent night,\nmy heart whispers your name like a prayer it never forgets.\n\nIn the quiet spaces of the day,\nin the chaos of the world,\nit is always you I choose.\n\nThrough every season,\nevery doubt,\nevery dream,\nmy heart will remain yours — steady, certain, and forever devoted. 💫";

let i = 0;
function typeWriter(){
  if(i < text.length){
    document.getElementById("typewriter").innerHTML += 
      text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}
typeWriter();

function showLove(){
  document.getElementById("popup").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function closeLove(){
  document.getElementById("popup").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}
</script>

</body>
</html>
