<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day 🤍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart-bg span {
      position: absolute;
      font-size: 18px;
      animation: float 10s linear infinite;
      opacity: 0.4;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      20% { opacity: 0.4; }
      100% {
        transform: translateY(-10vh) scale(1.3);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.18);
      padding: 34px 28px;
      border-radius: 24px;
      text-align: center;
      max-width: 340px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      animation: fadeIn 1.5s ease;
      z-index: 2;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart {
      font-size: 52px;
      animation: beat 1.3s infinite;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    h1 {
      margin: 18px 0 12px;
      font-size: 26px;
      letter-spacing: 0.6px;
    }

    p {
      font-size: 15.5px;
      line-height: 1.8;
      opacity: 0.95;
    }

    p strong {
      color: #fff;
      font-weight: 600;
    }

    .name {
      font-weight: 600;
      font-size: 18px;
      margin-top: 16px;
      letter-spacing: 0.3px;
    }

    .footer {
      margin-top: 22px;
      font-size: 14px;
      opacity: 0.9;
      font-style: italic;
    }

    .card:hover {
      transform: scale(1.02);
      transition: 0.4s ease;
    }
  </style>
</head>

<body>

  <!-- Background floating hearts -->
  <div class="heart-bg">
    <span style="left:10%; animation-delay:0s;">🤍</span>
    <span style="left:30%; animation-delay:2s;">🤍</span>
    <span style="left:50%; animation-delay:4s;">🤍</span>
    <span style="left:70%; animation-delay:6s;">🤍</span>
    <span style="left:90%; animation-delay:8s;">🤍</span>
  </div>

  <div class="card">
    <div class="heart">🤍</div>
    <h1>Happy Valentine’s Day</h1>
    <p>
      To my future wife,
      <br><br>
      <strong>Somewhere between today and forever,</strong>
      my heart is already holding space for you.
      <br><br>
      I promise love, respect, and endless care —
      <strong>today and always.</strong>
    </p>

    <div class="name">— Soumiya 💕</div>

    <div class="footer">
      With love, always
    </div>
  </div>

</body>
</html>
